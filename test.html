<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>komi · preview</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com data: blob:; connect-src 'self' https://api.lanyard.rest; media-src 'self'; frame-src https://open.spotify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@500;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --glass: rgba(16,16,16,0.55);
      --glass-strong: rgba(10,10,10,0.72);
      --line: rgba(255,255,255,0.10);
      --line-hot: rgba(255,255,255,0.24);
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --pink: #ff2e88;
      --ease: cubic-bezier(.22,.61,.36,1);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    body { text-transform: lowercase; }
    #preview-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100000;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #111;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      opacity: 0.85;
      pointer-events: none;
    }
    #enter-overlay {
      position: fixed;
      inset: 0;
      z-index: 90000;
      background: rgba(5,5,5,0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.7s var(--ease), visibility 0.7s;
    }
    #enter-overlay.hidden { opacity: 0; visibility: hidden; }
    .enter-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      animation: enterPulse 2s ease-in-out infinite;
    }
    .enter-inner svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #d8d8d8;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .enter-inner span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      color: #8a8a8a;
      margin-left: 0.28em;
    }
    @keyframes enterPulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    #wallpaper {
      position: fixed;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      z-index: 0;
      animation: wallpaperDrift 28s ease-in-out infinite alternate;
    }
    @keyframes wallpaperDrift {
      from { transform: scale(1.02) translate(-0.6%, -0.4%); }
      to { transform: scale(1.08) translate(0.6%, 0.5%); }
    }
    #bg-tint {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.62) 100%);
    }
    #snow-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      box-shadow: inset 0 0 220px rgba(0,0,0,0.85);
    }
    #stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.9s var(--ease) 0.15s, transform 0.9s var(--ease) 0.15s;
    }
    #stage.revealed { opacity: 1; transform: none; }
    #card {
      width: min(92vw, 400px);
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
      padding: 26px 22px 20px;
      box-sizing: border-box;
    }
    .card-top { display: flex; gap: 16px; align-items: center; }
    .avatar {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--line-hot);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.5);
      flex-shrink: 0;
      transition: border-color 0.25s var(--ease);
    }
    .avatar:hover { border-color: rgba(255,255,255,0.45); }
    .id-block { min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 9px; }
    #display-name {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .presence {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .presence .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #747f8d;
      flex-shrink: 0;
    }
    #presence-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 210px;
      display: inline-block;
    }
    .bio {
      margin-top: 5px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #d6d6d6;
    }
    .links {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .link-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--glass-strong);
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.05em;
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease), background 0.2s;
    }
    .link-btn:hover {
      border-color: var(--line-hot);
      transform: translateY(-2px);
      background: rgba(24,24,24,0.8);
    }
    .link-btn:active { transform: translateY(0); }
    .link-btn:focus-visible { outline: 1px solid var(--line-hot); outline-offset: 2px; }
    .link-btn svg { width: 15px; height: 15px; fill: #cfd4dc; flex-shrink: 0; }
    .embed { margin-top: 14px; }
    .embed iframe {
      width: 100%;
      height: 80px;
      border: 0;
      border-radius: 13px;
      display: block;
      background: rgba(0,0,0,0.35);
    }
    .live-line {
      margin-top: 11px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 14px;
    }
    .live-line .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      flex-shrink: 0;
    }
    .live-line .eq i {
      width: 2.5px;
      background: #1db954;
      border-radius: 1px;
      animation: eq 0.9s ease-in-out infinite;
    }
    .live-line .eq i:nth-child(1) { height: 45%; animation-delay: 0s; }
    .live-line .eq i:nth-child(2) { height: 90%; animation-delay: 0.25s; }
    .live-line .eq i:nth-child(3) { height: 60%; animation-delay: 0.5s; }
    @keyframes eq { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    .live-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .footer {
      position: fixed;
      left: 18px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #cfcfcf;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    .footer .views {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer svg { width: 14px; height: 14px; fill: none; stroke: #cfcfcf; stroke-width: 1.6; }
    @media (max-width: 480px) {
      #card { padding: 22px 16px 16px; }
      #display-name { font-size: 28px; }
      .avatar { width: 64px; height: 64px; }
      .footer { left: 12px; bottom: 12px; font-size: 10px; gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="enter-overlay">
    <div class="enter-inner">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span>click to enter</span>
    </div>
  </div>
  <div id="preview-badge">preview · test.html</div>
  <img id="wallpaper" src="./assets/wallpaper/DCA3UhDIVf.jpg" alt="">
  <div id="bg-tint"></div>
  <canvas id="snow-canvas"></canvas>
  <div id="vignette"></div>

  <main id="stage">
    <div id="card">
      <div class="card-top">
        <img id="avatar" class="avatar" src="./assets/pfp.png" alt="avatar" draggable="false">
        <div class="id-block">
          <div class="name-row"><span id="display-name">komi</span></div>
          <div class="presence"><span class="dot" id="presence-dot"></span><span id="presence-text">offline</span></div>
          <div class="bio">random friend requests will be ignored</div>
        </div>
      </div>
      <div class="links">
        <a class="link-btn" href="https://discord.gg/Qh4DDPMvk6" target="_blank" rel="noopener noreferrer" title="discord.gg/Qh4DDPMvk6">
          <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.22 14.22 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
          <span>discord</span>
        </a>
      </div>
      <div class="embed">
        <iframe src="https://open.spotify.com/embed/track/3NgGkD3vZHtFlgfIRJ5rBf?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="spotify embed"></iframe>
      </div>
      <div class="live-line" id="live-line"></div>
    </div>
  </main>

  <div class="footer">
    <span class="views">
      <svg viewBox="0 0 24 24"><path d="M12 5c5 0 9.27 3.11 11 7.5-1.73 4.39-6 7.5-11 7.5S2.73 16.89 1 12.5C2.73 8.11 7 5 12 5zm0 2C8.24 7 4.94 9.39 3.18 12.5 4.94 15.61 8.24 18 12 18s7.06-2.39 8.82-5.5C19.06 9.39 15.76 7 12 7zm0 2.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
      <span id="view-count-text"></span>
    </span>
  </div>

  <audio id="bg-audio" src="./assets/music/asking-me-why.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      const lanyardId = '1258873248406573178'; // my discord uid
      const defaultProfilePic = './assets/pfp.png';

      const bgAudio = document.getElementById('bg-audio');
      const overlay = document.getElementById('enter-overlay');
      const stage = document.getElementById('stage');
      let entered = false;
      function enter() {
        if (entered) return;
        entered = true;
        overlay.classList.add('hidden');
        stage.classList.add('revealed');
        bgAudio.volume = 0.4;
        bgAudio.play().catch(() => {});
      }
      overlay.addEventListener('click', enter, { once: true });
      window.addEventListener('keydown', enter, { once: true });

      function updateViewCounter() {
        let views = parseInt(localStorage.getItem('komi_views') || '0');
        if (!localStorage.getItem('komi_viewed')) {
          views++;
          localStorage.setItem('komi_views', views);
          localStorage.setItem('komi_viewed', 'true');
        }
        document.getElementById('view-count-text').textContent = views.toLocaleString() + ' views';
      }
      updateViewCounter();

      const snowCanvas = document.getElementById('snow-canvas');
      const ctx = snowCanvas.getContext('2d');
      let flakes = [];
      function resizeSnow() {
        snowCanvas.width = window.innerWidth;
        snowCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeSnow);
      resizeSnow();
      // scale flakes with screen width, cap so it doesn't chug
      const FLAKE_COUNT = Math.min(140, Math.floor(window.innerWidth / 9));
      for (let i = 0; i < FLAKE_COUNT; i++) {
        flakes.push({
          x: Math.random() * snowCanvas.width,
          y: Math.random() * snowCanvas.height,
          r: Math.random() * 1.8 + 0.6,
          s: Math.random() * 0.7 + 0.25,
          drift: Math.random() * 0.6 - 0.3,
          o: Math.random() * 0.5 + 0.25
        });
      }
      function drawSnow() {
        ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
        for (const f of flakes) {
          f.y += f.s;
          f.x += f.drift + Math.sin(f.y * 0.01) * 0.2;
          if (f.y > snowCanvas.height + 4) { f.y = -4; f.x = Math.random() * snowCanvas.width; }
          if (f.x > snowCanvas.width + 4) f.x = -4;
          if (f.x < -4) f.x = snowCanvas.width + 4;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
          ctx.fill();
        }
        requestAnimationFrame(drawSnow);
      }
      drawSnow();

      const STATUS_COLORS = { online: '#43b581', idle: '#faa61a', dnd: '#f04747', offline: '#747f8d' };
      function discordAvatarUrl(user, size) {
        if (!user || !user.id || !user.avatar) return defaultProfilePic;
        const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
        return 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.' + ext + '?size=' + (size || 128);
      }
      function fetchLanyard() {
        fetch('https://api.lanyard.rest/v1/users/' + lanyardId)
          .then(r => r.json())
          .then(data => {
            if (!data || !data.success || !data.data) return;
            const d = data.data;
            const user = d.discord_user || {};
            document.getElementById('avatar').src = discordAvatarUrl(user, 256);
            const st = d.discord_status || 'offline';
            const dot = document.getElementById('presence-dot');
            dot.style.background = STATUS_COLORS[st] || STATUS_COLORS.offline;
            let txt = st;
            const custom = (d.activities || []).find(a => a.type === 4);
            if (custom && custom.state) {
              txt += ' · ' + (custom.emoji && custom.emoji.name ? custom.emoji.name + ' ' : '') + custom.state;
            }
            document.getElementById('presence-text').textContent = txt;
            const live = document.getElementById('live-line');
            live.textContent = '';
            if (d.spotify && d.spotify.track_id) {
              const eq = document.createElement('span');
              eq.className = 'eq';
              eq.innerHTML = '<i></i><i></i><i></i>';
              const txt = document.createElement('span');
              txt.textContent = 'listening to ' + d.spotify.song + ' — ' + d.spotify.artist;
              live.append(eq, txt);
            }
          })
          .catch(() => {});
      }
      fetchLanyard();
      setInterval(fetchLanyard, 15000); // lanyard rate limit is fine at 15s

      (function tabPulse() {
        const name = 'komi';
        let i = -2;
        setInterval(() => {
          document.title = i < 0 ? name
            : name.slice(0, i) + name[i].toUpperCase() + name.slice(i + 1);
          i = i + 1 >= name.length ? -2 : i + 1;
        }, 380);
      })();
    })();
  </script>
</body>
</html>
